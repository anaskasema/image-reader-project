<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة فحص الصور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="wrap">
        <button id="themeToggle" class="theme-toggle" title="تبديل الوضع">🌙</button>

        <header class="hero">
            <span class="eyebrow">تحليل صور بالذكاء الاصطناعي</span>
            <h1>محطة فحص الصور</h1>
            <p class="hero-sub">ارفع صورة، وهنقرا أي نص فيها ونوصف محتواها تلقائيًا.</p>
        </header>

        <section class="lightbox" id="lightbox" tabindex="0">
            <div class="scan-line" id="scanLine"></div>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <div class="lightbox-content" id="lightboxContent">
                <img id="preview" class="preview-img" hidden alt="معاينة الصورة المرفوعة">
                <div class="drop-hint" id="dropHint">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <path d="M21 15l-5-5L5 21" />
                    </svg>
                    <span>اضغط أو اسحب صورة هنا</span>
                </div>
            </div>
        </section>

        <div class="file-meta" id="fileMeta" hidden>
            <span id="fileName"></span>
            <span id="fileSize"></span>
            <button class="remove-file" id="removeFile" type="button">حذف</button>
        </div>

        <div class="actions">
            <button class="btn-primary" id="analyzeBtn" disabled>حلّل الصورة</button>
            <button class="btn-secondary" id="resetBtn" type="button">صورة جديدة</button>
            <span class="status" id="status"></span>
        </div>

        <section class="results" id="results" hidden>
            <div class="results-toolbar">
                <span class="results-title">نتيجة التحليل</span>
                <button class="btn-secondary" id="downloadBtn" type="button">تنزيل النتيجة</button>
            </div>
            <div class="panel">
                <div class="panel-heading">
                    <span class="panel-label">OCR // النص المستخرج</span>
                    <button class="copy-btn" id="copyBtn" type="button">نسخ</button>
                </div>
                <p class="panel-content" id="textResult"></p>
            </div>
            <div class="panel">
                <span class="panel-label">VISION // وصف الصورة</span>
                <p class="panel-content" id="captionResult"></p>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
